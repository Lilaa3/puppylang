  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Gorditas:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="veil"></div>
  <div class="bg bg-1"><img src="freak.webp" alt=""></div>
  <div class="bg bg-2"><img src="freak.webp" alt=""></div>

  <main>
    <h1>ever wondered what this
      <span style="font-size:2em;display:inline-block;transform:rotate(-4deg)">fucking</span>
      freak is talking about when she is like<br />
      <span style="font-size:2.4em;display:inline-block;transform:rotate(-6deg)">WOOF WOOF</span>
      <br />
      yeah ok she <span style="font-size:1.8em;display:inline-block;transform:rotate(3deg)">MIGHT</span>
      be calling you gay..
    </h1>
    <p>The CIA WISHES they were at my level, arf!</p>
    <h2>In comes human words</h2>
    <div class="box">
      <textarea id="text" placeholder="type here"></textarea>
      <button type="button" class="copy" aria-label="Copy text" title="Copy">
        <img src="copy.svg" alt="">
      </button>
    </div>
    <h2>Out goes <i>*woof*</i></h2>
    <div class="box">
      <textarea id="woof" placeholder="woof here" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
      <button type="button" class="copy" aria-label="Copy woof" title="Copy">
        <img src="copy.svg" alt="">
      </button>
    </div>
  </main>

  <footer>🐾 © 2026 Lilaa3</footer>

  <a class="info" href="mechanisms.html" title="How does puplang work?"><img src="info.svg" alt=""></a>

  <script src="settings.js"></script>
  <script src="puplang.js"></script>
  <script>
    (async () => {
      const module = await createPuplangModule();
      const settings = PUPLANG_SETTINGS;

      const text = document.getElementById("text");
      const woof = document.getElementById("woof");

      const setError = (el, on) => el.classList.toggle("error", on);

      text.addEventListener("input", () => {
        const out = module.ccall("puplang_encode", "string", ["string", "string"], [text.value, settings]);
        woof.value = out;
        setError(text, module.ccall("puplang_last_error", "string", [], []) !== "");
        setError(woof, false);
      });

      woof.addEventListener("input", () => {
        const out = module.ccall("puplang_decode", "string", ["string", "string"], [woof.value, settings]);
        const err = module.ccall("puplang_last_error", "string", [], []);
        setError(woof, err !== "");
        setError(text, false);
        if (err === "") {
          text.value = out;
        }
      });

      document.querySelectorAll(".box").forEach(box => {
        const ta = box.querySelector("textarea");
        const btn = box.querySelector(".copy");
        btn.addEventListener("click", async () => {
          const value = ta.value;
          btn.classList.add("copied");
          setTimeout(() => btn.classList.remove("copied"), 1200);
          if (!value) return;
          await navigator.clipboard.writeText(value);
        });
      });
    })();
  </script>
</body>

</html>
