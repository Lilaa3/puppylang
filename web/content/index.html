<!doctype html>
<html lang="en">

<template id="status-panel-template">
  <div class="status-panel">
    <div class="download-area hidden">
      <button type="button" class="download-btn">
        <span>Download Result</span>
      </button>
    </div>

    <div class="progress-area hidden">
      <div class="progress-track">
        <div class="progress-bar"></div>
      </div>
      <span class="progress-text">0%</span>
    </div>

    <div class="error-message hidden">
      <img src="error.svg" alt="" class="error-icon">
      <span class="error-text"></span>
    </div>
  </div>
</template>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>puplang</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Gorditas:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="bg bg-1"><img src="freak.webp" alt=""></div>
  <div class="bg bg-2"><img src="freak.webp" alt=""></div>

  <main>
    <h1>ever wondered what this
      <span style="font-size:2em;display:inline-block;transform:rotate(-4deg)">fucking</span>
      freak is talking about when she is like<br />
      <span style="font-size:2.4em;display:inline-block;transform:rotate(-6deg);white-space: nowrap;">
        WOOF WOOF
      </span>
      <br />
      yeah ok she <span style="font-size:1.8em;display:inline-block;transform:rotate(3deg)">MIGHT</span>
      be calling you gay..
    </h1>
    <p>The CIA WISHES they were at my level, arf!</p>

    <h2 style="margin-bottom:3px">In comes human words</h2>
    <div class="box">
      <textarea id="text" placeholder="type here"></textarea>
      <div class="side-buttons">
        <button type="button" class="hold-button-anim textbox-side-button copy" aria-label="Copy text" title="Copy">
          <img src="copy.svg" alt="">
        </button>
        <button id="settings-toggle" class="textbox-side-button settings-toggle" aria-label="Toggle settings"
          title="Encode Options">
          <img src="cog.svg" alt="">
        </button>
        <button type="button" id="randomize-seed" class="hold-button-anim textbox-side-button randomize-btn"
          aria-label="Randomize Seed" title="Randomize Seed">
          <img src="randomize.svg" alt="">
        </button>
        <button type="button" id="encode-file-btn" class="hold-button-anim textbox-side-button"
          aria-label="Encode from file" title="Encode from file">
          <img src="upload.svg" alt="">
        </button>
        <input type="file" id="encode-file-input" accept="text/*" hidden>
      </div>
    </div>

    <div id="encode-status"></div>

    <div id="settings-panel" class="settings-panel hidden">
      <div class="panel-head">
        <h3>Encode Options</h3>
        <button type="button" id="reset-settings">Reset</button>
      </div>

      <div class="settings-grid">
        <div class="setting-item">
          <label for="seed">Seed</label>
          <input type="number" id="seed" min="0" max="18446744073709551615" value="64">
        </div>

        <div class="setting-item">
          <label for="set_free_extension_limit">Free Extension Limit</label>
          <input type="number" id="set_free_extension_limit" min="0" max="10" value="0">
        </div>

        <div class="setting-item">
          <label for="max_short_extension">Max Short Extension</label>
          <input type="number" id="max_short_extension" min="0" max="10" value="2">
        </div>

        <div class="setting-item setting-slider">
          <label for="length_decay_rate">Length Decay Rate</label>
          <div class="control-group">
            <input type="range" id="length_decay_rate" min="0" max="100" value="50" step="0.1">
            <output id="length_decay_rate-value">50.00%</output>
          </div>
        </div>

        <div class="setting-item setting-slider">
          <label for="uppercase_weight">Uppercase Weight</label>
          <div class="control-group">
            <input type="range" id="uppercase_weight" min="0" max="100" step="0.1" value="40">
            <output id="uppercase_weight-value">40.00%</output>
          </div>
        </div>

        <div class="setting-item toggle-row">
          <label for="howl-enabled">
            <img src="howling.svg" alt="" class="howl-icon svg-color"> Howling
          </label>
          <input type="checkbox" id="howl-enabled" checked>
        </div>

        <div class="howl-option">
          <div class="setting-item setting-slider">
            <label for="initial_howl_chance">Howl Chance</label>
            <div class="control-group">
              <input type="range" id="initial_howl_chance" min="0" max="100" step="0.1" value="20">
              <output id="initial_howl_chance-value">20.00%</output>
            </div>
          </div>

          <div class="setting-item setting-slider">
            <label for="howl_decay">Howl Decay</label>
            <div class="control-group">
              <input type="range" id="howl_decay" min="0" max="100" step="0.1" value="50">
              <output id="howl_decay-value">50.00%</output>
            </div>
          </div>
          <div class="setting-item setting-slider">
            <label for="min_howl">Minimum Howl Chance</label>
            <div class="control-group">
              <input type="range" id="min_howl" min="0" max="100" step="0.1" value="10">
              <output id="min_howl-value">10.00%</output>
            </div>
          </div>
        </div>
      </div>
    </div>
    <h2 style="margin-bottom:3px">Out goes <i>*woof*</i></h2>
    <div class="box">
      <textarea id="woof" placeholder="woof here" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
      <div class="side-buttons">
        <button type="button" class="copy hold-button-anim textbox-side-button" aria-label="Copy woof" title="Copy">
          <img src="copy.svg" alt="">
        </button>
        <button type="button" id="decode-file-btn" class="hold-button-anim textbox-side-button"
          aria-label="Decode from file" title="Decode from file">
          <img src="upload.svg" alt="">
        </button>
        <input type="file" id="decode-file-input" accept="text/*" hidden>
      </div>
    </div>

    <div id="decode-status"></div>

  </main>

  <footer>🐾 © 2026 Lilaa3</footer>

  <a class="info" href="mechanisms.html" title="How does puplang work?"><img src="info.svg" alt=""></a>

  <script src="puplang.js"></script>
  <script src="script.js"></script>
</body>

</html>
